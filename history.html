<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f5132" />
    <title>Game History — Poker Night Ledger</title>
    <meta
      name="description"
      content="Lifetime standings and past shared games for the poker night ledger."
    />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" href="./icons/icon.svg" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="app-bar">
      <div class="brand">
        <span class="chip" aria-hidden="true"></span>
        <h1>Game History</h1>
      </div>
      <div class="head-actions">
        <a class="ghost small" href="./index.html">New calculation</a>
      </div>
    </header>
    <main>
      <section class="card">
        <div class="card-head">
          <h2>Who still owes</h2>
          <span class="muted small" id="outstandingNote"></span>
        </div>
        <div class="table-scroll">
          <table class="report" id="outstandingTable"></table>
        </div>
      </section>

      <section class="card">
        <div class="card-head">
          <h2>Lifetime standings</h2>
          <span class="muted small" id="leaderboardNote"></span>
        </div>
        <div class="table-scroll">
          <table class="report" id="leaderboardTable"></table>
        </div>
      </section>

      <section class="card">
        <div class="card-head">
          <h2>Past games</h2>
        </div>
        <div class="table-scroll">
          <table class="report" id="gamesTable"></table>
        </div>
      </section>
    </main>

    <footer class="foot muted small">
      Only games shared with "Copy text" / "Share to WhatsApp" appear here.
    </footer>

    <div id="toast" class="toast" hidden></div>

    <script type="module" src="./history.js"></script>
  </body>
</html>
