name: Keep Supabase awake

# Supabase pauses free-tier projects after 7 days without activity, which breaks
# payment links, History and name suggestions between game nights. A cheap read
# twice a week (never more than 4 days apart) keeps it active. This cannot wake a
# project that is already paused - restore it from the dashboard first.

on:
  schedule:
    - cron: '0 14 * * 1,4' # Mondays and Thursdays, 14:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read one row from Supabase
        run: |
          # Take the URL and publishable (public-by-design) key from the app's own
          # config so this can never drift from what the site actually uses.
          URL=$(grep -oE 'https://[a-z0-9]+\.supabase\.co' src/supabaseClient.js | head -1)
          KEY=$(grep -oE 'sb_publishable_[A-Za-z0-9_-]+' src/supabaseClient.js | head -1)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "Could not read the Supabase URL/key from src/supabaseClient.js" >&2
            exit 1
          fi
          # -f makes any non-2xx (e.g. 521 when the project is paused) fail the job,
          # so GitHub emails you instead of this failing silently.
          curl -fsS --max-time 30 "$URL/rest/v1/games?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY"
          echo
          echo "Supabase responded OK"
